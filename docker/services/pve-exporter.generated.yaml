# GENERATED by scripts/gen-exporters.py from telemetry/pve.yml. Do NOT edit by hand — change the
# descriptor's `exporter:` block and re-run (deploy-stack regenerates it before bring-up).
#
# Access chain used:   control VM (kontroll net) -> https://<pve host>:8006 with the read-only *.Audit API token
# May break:           nothing — a read-only scrape; a token/SSL failure degrades a Grafana panel, not the lab
# Fallback required:   no
# Blast radius:        control node only (queries the PVE API read-only; actuates NOTHING on the cluster)
#
# No host port is published — reachable only on the internal kontroll network, never WAN
# (SECURITY.md C3); a tests/validate check enforces no `ports:` in exporter fragments.
services:
  pve-exporter:
    image: prompve/prometheus-pve-exporter:3.9.0
    container_name: pve-exporter
    restart: unless-stopped
    environment:
      PVE_USER: ${PVE_EXPORTER_USER:-}
      PVE_TOKEN_NAME: ${PVE_EXPORTER_TOKEN_NAME:-}
      PVE_TOKEN_VALUE: ${PVE_EXPORTER_TOKEN_VALUE:-}
      PVE_VERIFY_SSL: 'false'
    networks:
      - kontroll
networks:
  kontroll:
    external: true
    name: kontroll
