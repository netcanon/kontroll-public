# docker-socket-proxy — the FILTERED, read-only Docker API that Vector's docker_logs source talks to, so the
# raw root-equivalent /var/run/docker.sock is NEVER mounted into Vector (the C12 promotion-blocker fix). Only THIS
# proxy holds the socket; it exposes a GET/HEAD-only HAProxy filter (POST=0 ⇒ the whole API is read-only, cannot
# create/exec/kill a container) on its OWN internal network, `kontroll-socket`, which Vector alone joins. Brought up
# as a dependency of Vector (vector.yaml depends_on), only when 'vector' is deployed — provision-only-what's-declared.
#
# Why its own network and not the shared `kontroll` one: even read-only, `GET /containers/<id>/json` returns a
# container's Config.Env — every secret the stack passes a container by environment (SEMAPHORE_ACCESS_KEY_ENCRYPTION
# decrypts the store holding the runner's age key). On the shared network any of the stack's containers could have
# asked (2026-10-08 review, finding 4). Now only Vector can reach the proxy at all; tests/unit/test_compose_logging.py
# pins that no other fragment joins `kontroll-socket`.
#
# Access chain used:   holds /var/run/docker.sock (:ro) and exposes a GET/HEAD-only Docker API (CONTAINERS reads
#                      only) on `kontroll-socket`; Vector targets http://docker-socket-proxy:2375, never the raw socket.
# May break:           nothing — a read-only API filter; if the proxy is down, docker_logs blanks (others fine).
# Fallback required:   no.
# Blast radius:        control node only — NO host port (C3), NOT on the shared stack network (only Vector can reach
#                      it); POST=0 ⇒ cannot create containers.
services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0   # pinned tag (consistent with the rest of the stack; the one
                                                 # load-bearing assertion — POST=0 + no ports — is test-pinned)
    container_name: docker-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"          # list/inspect/logs — the ONLY grant docker_logs needs
      EVENTS: "1"              # the container lifecycle stream docker_logs watches (Tecnativa default 1; explicit)
      PING: "1"               # health (default 1; explicit)
      VERSION: "1"            # docker_logs negotiates the API version (default 1; explicit)
      POST: "0"                # GET/HEAD only ⇒ the entire API is read-only (cannot create/exec/kill) — the block
      EXEC: "0"
      IMAGES: "0"
      NETWORKS: "0"
      VOLUMES: "0"
      INFO: "0"
      SERVICES: "0"
      TASKS: "0"
      SECRETS: "0"
      CONFIGS: "0"
      ALLOW_RESTARTS: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro   # ONLY the proxy touches the raw socket
    # MUST be false for tecnativa/docker-socket-proxy:0.3.0: its entrypoint `sed`s the SHIPPED
    # /usr/local/etc/haproxy/haproxy.cfg.template into haproxy.cfg IN THAT SAME DIR at startup —
    # read_only:true blocks the write (crash loop), and a tmpfs overlay on the dir HIDES the shipped
    # template (a different crash). So RO-root cannot work here; no-new-privileges + the GET/HEAD-only
    # socket filter + the portless kontroll-network-only reach remain the real controls (see header).
    read_only: false
    tmpfs:
      - /run                   # HAProxy's runtime socket/pid
    security_opt:
      - no-new-privileges:true
    # NO `ports:` (C3) and NOT on the shared `kontroll` network: only `kontroll-socket`, which Vector alone joins —
    # it reaches the proxy by service name over that network. `internal: true` at creation (deploy-stack): nothing
    # on it needs egress.
    networks:
      - kontroll-socket

networks:
  kontroll-socket:
    external: true
    name: kontroll-socket
