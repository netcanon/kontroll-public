# GENERATED by scripts/gen-exporters.py from telemetry/blackbox.yml. Do NOT edit by hand — change the
# descriptor's `exporter:` block and re-run (deploy-stack regenerates it before bring-up).
#
# Access chain used:   control VM -> blackbox-exporter -> ICMP/TCP/HTTP probe of <device> (mgmt VLAN)
# May break:           nothing — a read-only reachability probe; a probe failure blanks a panel, not the lab
# Fallback required:   no
# Blast radius:        control node only (?target set is GENERATED from inventory — SSRF-bounded; actuates nothing)
#
# No host port is published — reachable only on the internal kontroll network, never WAN
# (SECURITY.md C3); a tests/validate check enforces no `ports:` in exporter fragments.
services:
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    container_name: blackbox-exporter
    restart: unless-stopped
    volumes:
      - ../../prometheus/exporters/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    cap_add:
      - NET_RAW
    networks:
      - kontroll
networks:
  kontroll:
    external: true
    name: kontroll
