# GENERATED by scripts/gen-logging.py from instance/fleet.yml + modules/<key>/module.yml's `logs:`
# block + the logging/<method>.yml registry. Do NOT edit by hand — change a module's `logs:` block
# and re-run (deploy-stack regenerates it before bringing Vector up). Loaded via the Vector
# `--config-dir /etc/vector/generated` (full-config fragments, explicit component ids).
sources:
  proxmox_api_proxmox_src:
    type: http_client
    endpoint: https://192.0.2.10:8006/api2/json/cluster/tasks
    method: GET
    scrape_interval_secs: 3600
    decoding:
      codec: json
    auth:
      strategy: custom
      value: PVEAPIToken=${KONTROLL_PVE_LOG_TOKEN}
    tls:
      verify_certificate: false
transforms:
  proxmox_api_proxmox_unnest:
    type: remap
    inputs:
    - proxmox_api_proxmox_src
    source: "if is_array(.data) {\n    . = unnest!(.data)\n}\n"
  proxmox_api_proxmox_dedupe:
    type: dedupe
    inputs:
    - proxmox_api_proxmox_unnest
    fields:
      match:
      - data.upid
  proxmox_api_proxmox_shape:
    type: remap
    inputs:
    - proxmox_api_proxmox_dedupe
    source: '.source = "capability"

      .device = "proxmox"

      .service = string(.data.type) ?? .service

      .host = string(.data.node) ?? .host

      .level = if (string(.data.status) ?? "") == "OK" { "info" } else { "error" }

      .run_id = string(.data.upid) ?? .run_id

      .message = encode_json(.data)

      if !is_string(.service) { .service = "proxmox_api" }

      if !is_string(.host) { .host = "my-hypervisor" }

      if !is_string(.level) { .level = "info" }

      '
