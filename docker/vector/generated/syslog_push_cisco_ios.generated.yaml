sources:
  syslog_push_cisco_ios_src:
    type: syslog
    mode: tcp
    address: 0.0.0.0:5514
    max_length: 102400
transforms:
  syslog_push_cisco_ios_shape:
    type: remap
    inputs:
    - syslog_push_cisco_ios_src
    source: '.source = "capability"

      .device = "cisco_ios"

      .level = string(.level) ?? string(.severity) ?? .level

      if !is_string(.service) { .service = "syslog_push" }

      if !is_string(.host) { .host = "my-switch" }

      if !is_string(.level) { .level = "info" }

      '
