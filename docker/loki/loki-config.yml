# Loki single-binary config — filesystem object store, TSDB index (schema v13, 24h period —
# MANDATORY for retention), compactor-driven BOUNDED retention. Reached at :3100 (push + query).
# The retention window is ${LOKI_RETENTION_PERIOD}, expanded by `-config.expand-env=true` (set in
# docker/services/loki.yaml command). The container env ALWAYS supplies LOKI_RETENTION_PERIOD (the compose
# fragment defaults it to 720h via ${LOKI_RETENTION_PERIOD:-720h}), so this never expands to empty —
# an EMPTY retention_period means INFINITE retention (unbounded disk), the exact failure to guard.
# NOTE: Loki's expand-env is Go os.Expand — it honours ${VAR} but NOT ${VAR:-default}; the default lives
# in the compose env, never here. Default Loki keeps logs FOREVER — the compactor block below is what bounds
# them. Sourced: grafana.com/docs/loki retention + TSDB docs.

auth_enabled: false                      # single-tenant homelab; no X-Scope-OrgID

server:
  http_listen_port: 3100                 # push + query API + the Grafana datasource
  grpc_listen_port: 9096
  log_level: info

common:
  path_prefix: /loki                     # chunks/index/index_cache/retention all live under here
  replication_factor: 1                  # single replica — REQUIRED with the inmemory ring
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h                      # MUST be 24h — retention is only available at a 24h index period

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/index_cache
  filesystem:
    directory: /loki/chunks

compactor:
  working_directory: /loki/retention     # marked chunks + temp tables
  retention_enabled: true                # REQUIRED — off by default => logs would live forever
  delete_request_store: filesystem       # REQUIRED when retention on; must match the object store
  compaction_interval: 10m
  retention_delete_delay: 2h             # grace before marked chunks are deleted
  retention_delete_worker_count: 150

limits_config:
  retention_period: ${LOKI_RETENTION_PERIOD}   # GLOBAL default 30d (from the compose env; 0/empty = infinite)
  retention_stream:
    # debug noise expires fast; keep the index lean.
    - selector: '{level="debug"}'
      priority: 1
      period: 168h                       # 7 days
    # security-relevant internal audit streams kept longer than the 30d default (still bounded).
    - selector: '{source="internal", service=~"api-audit|gui-audit"}'
      priority: 2
      period: 2160h                      # 90 days
  reject_old_samples: true
  # Match the LONGEST stream retention (90d) so backfilled audit history is accepted on first ingest, not
  # silently dropped (a 7d cap would truncate the rotated audit files Vector reads from `read_from: beginning`).
  reject_old_samples_max_age: 2160h
  max_cache_freshness_per_query: 10m
  # Cardinality guardrails (defence-in-depth behind the Vector-side label allow-list / C12):
  max_label_names_per_series: 12         # a hard ceiling — the canonical schema uses 6
  max_streams_per_user: 5000

# Per-class capability log retention (S5) — a GENERATED runtime_config overrides file, HOT-RELOADED (no restart,
# no edit here). It layers per-tenant (`fake`, since auth_enabled:false) retention_stream entries that a device
# class opted into via a `retention` param OVER the baseline above; absent any, the file is `overrides: {}` and
# the baseline alone applies. Generated by scripts/gen-logging.py (deploy-stack regenerates it before bringing
# Loki up); mounted RO from docker/loki/overrides/. Verified on Loki 3.4.2 by the M-1 dogfood — which also found
# that an INVALID runtime_config is FATAL at startup (Loki refuses to come up), so the generator only ever emits
# valid >= 24h periods and an always-valid empty default. See docs/reviews/2026-06-16-storage-logging/40-*.
runtime_config:
  file: /etc/loki/overrides/retention.generated.yaml
  period: 10s

# No analytics phone-home from a homelab control plane.
analytics:
  reporting_enabled: false
