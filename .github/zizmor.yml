# zizmor site config — kontroll hybrid action-pinning policy (mirrors netcanon).
#
# unpinned-uses fires only on THIRD-PARTY action publishers. First-party publishers
# (`actions/*`, `github/*`) may use tag-pins — GitHub controls those repos and force-push
# protections apply. Third-party publishers must SHA-pin (a hijacked tag in a third-party
# org is a real, if low-probability, supply-chain compromise vector). Without this policy
# the rule re-fires on every `actions/checkout@v6` call, drowning real findings in noise.
#
# kontroll's third-party actions are the docker/* set in publish-images.yml (the one job that
# can push to the package namespace); each is SHA-pinned with a version comment and Dependabot
# keeps the pins current (tests/unit/test_ci_workflows.py pins the rule). The scan is advisory:
# a new third-party tag-pin is FLAGGED in the log (and in the Security tab where the SARIF seat
# is on), never blocked — SECURITY.md C6.
rules:
  unpinned-uses:
    config:
      policies:
        "actions/*": ref-pin   # GitHub-owned, force-push protected
        "github/*": ref-pin    # GitHub-owned
        "*": hash-pin          # third-party publishers: SHA required
