# Discovery method: read a MikroTik RouterOS router's OWN DHCP-server lease table read-only, to surface un-onboarded
# hosts on the network into the onboard inbox. Rung 2 — a vendor SIBLING of dhcp_leases_opnsense: a pure DROP-IN
# (this file + a one-line offer block on modules/routeros/module.yml), ZERO code change — the sweep's `json_rows`
# parser already reads a BARE top-level JSON array (RouterOS REST returns `[ {...}, ... ]`, no wrapper key) and the
# `basic` auth strategy already composes HTTP Basic. PASSIVE by construction: the sweep GETs the lease view an
# already-onboarded router already keeps; it NEVER scans the network (no ICMP/ARP sweep, no CIDR expansion — only the
# onboarded device address). Read-only: an HTTP GET reads leases and actuates NOTHING. SECURITY C18.
#
# NOTE routeros is a STAGED class (commented out of the fleet + inventory until the post-cutover core migration), so
# this offer is DORMANT — the sweep visits it only once routeros is enabled, exactly like the class's derived
# telemetry floor. It ships now so the method is ready at cutover (a codeless drop-in, proven hermetically in CI).
#
# Auth/token flow (C12): RouterOS REST uses HTTP Basic against a console user -> Authorization: Basic base64(user:pass).
# INJECTED as ${KONTROLL_ROUTEROS_DISCOVERY_USER}/${KONTROLL_ROUTEROS_DISCOVERY_PASSWORD} at the fetcher boundary from
# the existing `network` SOPS domain, reused AS-SCOPED (a read-only API user; never widened). The value enters ONLY at
# the fetcher boundary, never the audit line / the artifact (NAMES + counts only). Unset creds => the source is
# recorded `no-creds` and skipped (honest, non-fatal) — CI never needs them (proven via an injected fake fetcher).
#
# F11 (dogfood-confirmed-not-CI-confirmed, mirrors opnsense): the endpoint + row field NAMES are the documented
# RouterOS v7 REST shape (GET /rest/ip/dhcp-server/lease -> a bare array of leases; values encoded as JSON strings;
# fields address / mac-address / host-name). CI pins the parser against a mocked fixture of this shape
# (tests/fixtures/discovery/routeros_dhcp.json). The deferred live dogfood confirms/corrects it — a 1-line edit.
name: dhcp_leases_routeros
label: RouterOS DHCP leases (read the router's own lease table, read-only)
order: 30
source:
  endpoint: "https://${DEVICE_ADDR}/rest/ip/dhcp-server/lease"   # the sweep templates the host addr; mgmt-routed
  method: GET                                                    # hard-wired GET (the fetcher has no other verb)
  auth:
    strategy: basic                            # RouterOS REST => HTTP Basic (console user=user, password=pass)
    value: "${KONTROLL_ROUTEROS_DISCOVERY_USER}:${KONTROLL_ROUTEROS_DISCOVERY_PASSWORD}"   # ${ENV} refs only
  verify: false                                # a RouterOS box serves a self-signed www-ssl cert; a read-only GET.
# The parse SHAPE is a NAME the sweep's `_PARSERS` table keys on — NO function knows the word "routeros" (de-bespoke).
# `json_rows` with NO `rows:` = a BARE top-level array `[ {<fields>}, ... ]` (the parser's list fall-through).
parse:
  shape: json_rows                             # NO `rows:` — RouterOS returns a bare array (the fall-through path)
  fields: {ip: address, mac: mac-address, hostname: host-name}   # response field -> canonical {ip, mac, hostname}
secret_domain: network                         # REUSE the existing network domain's RouterOS API user, read-only use;
                                               # audited by NAME only (C12). No new SOPS domain.
# CREDS ARE OPERATOR-EXPORTED at sweep time (there is deliberately NO secret_env_map): gen-secret-env renders .env from
# metrics:/logs: only, never discovery:, and the network-domain field name is INSTANCE-GENERATED by onboard (pattern
# <ns>_<coll>_<N>_<field>) so a shipped descriptor cannot hardcode it. Before the sweep the operator exports
# KONTROLL_ROUTEROS_DISCOVERY_USER/PASSWORD from that domain — see discovery/README.md § Extending. Unset =>
# `no-creds`, skipped. (routeros is STAGED — its network field is created at the post-cutover onboard.)
# NO applies_when -> DECLARED-only (opt-in per class, like opnsense/logging's proxmox_api). community.routeros ships a
# cliconf plugin (not httpapi), so the class drives config over SSH but is READ for leases over its REST API — the
# offer is declared, never facts-derived. The class opts in via a `discovery:` block in its module.yml.
access_chain:
  chain: "control VM (kontroll net) -> sweep http_get -> HTTPS GET <routeros>/rest/ip/dhcp-server/lease (read-only)"
  may_break: nothing — a read-only lease poll; a creds/reach failure records the source `no-creds`/`unreachable`
  fallback: "no"
  blast_radius: control node only (an HTTP GET reads the lease table; actuates NOTHING on the router)
