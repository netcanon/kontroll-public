# Discovery method: read a FortiGate/FortiOS firewall's OWN DHCP lease table read-only, to surface un-onboarded hosts
# on the network into the onboard inbox. Rung 2 — the FIRST vendor SIBLING of dhcp_leases_opnsense: a pure DROP-IN
# (this file + a one-line offer block on modules/fortigate/module.yml), ZERO code change — the sweep's `json_rows`
# parser already reads a `<rows>`-keyed JSON body and the `custom` auth strategy already emits a verbatim
# Authorization header. PASSIVE by construction: the sweep GETs the lease view an already-onboarded firewall already
# keeps; it NEVER scans the network (no ICMP/ARP sweep, no CIDR expansion — only the onboarded device address).
# Read-only: an HTTP GET reads leases and actuates NOTHING. SECURITY C18 (same trust boundary as opnsense).
#
# Auth/token flow (C12): FortiOS REST uses a token-scoped API admin -> `Authorization: Bearer <api-token>` (the
# header form, NOT the ?access_token= query param — a query token leaks into access logs). INJECTED as
# ${KONTROLL_FORTIGATE_DISCOVERY_TOKEN} at the fetcher boundary from the existing `network` SOPS domain, reused
# AS-SCOPED (a read-only monitor token; never widened). The value enters ONLY at the fetcher boundary, never the
# audit line / the artifact (which carry NAMES + counts only). Unset creds => the source is recorded `no-creds` and
# skipped (honest, non-fatal) — CI never needs them (the dispatch/parse is proven via an injected fake fetcher).
#
# F11 — LIVE-DOGFOOD-CONFIRMED 2026-07-03 against FortiOS v7.2.13: GET /api/v2/monitor/system/dhcp returned
# {"status":"success","results":[ {ip, mac, hostname, interface, status, type, ...}, ... ]} — the `results` array +
# the `ip`/`mac`/`hostname` fields below are EXACT (15 real leases parsed 15/15 with all three fields). No shape edit
# needed. TWO operational notes the dogfood surfaced: (1) the FortiGate REST API is trusthost-gated — the CONTROL NODE
# must be in the API admin's trusthost or the read is 403 (the reused config-role token then works read-only); (2)
# FortiOS rate-limits repeated auth (429) — the sweep does ONE GET/source (gentle) + treats a non-200 as a recorded
# status, never a retry. IPv6 leases (if returned) surface an IPv6 `ip` the pure read-side ipv4 guard drops.
name: dhcp_leases_fortigate
label: FortiGate DHCP leases (read the firewall's own lease table, read-only)
order: 20
source:
  endpoint: "https://${DEVICE_ADDR}/api/v2/monitor/system/dhcp"   # the sweep templates the host addr; mgmt-routed
  method: GET                                                     # hard-wired GET (the fetcher has no other verb)
  auth:
    strategy: custom                           # FortiOS REST API token => a verbatim `Authorization: Bearer <token>`
    value: "Bearer ${KONTROLL_FORTIGATE_DISCOVERY_TOKEN}"   # ${ENV} only; the secret never appears committed
  verify: false                                # a firewall serves a self-signed API cert; a read-only lease GET.
                                               # Deriving the posture from vendor_defaults is a later rung.
# The parse SHAPE is a NAME the sweep's `_PARSERS` table keys on — NO function knows the word "fortigate" (de-bespoke,
# the no-bespoke-config tenet). `json_rows` with `rows: results` = a JSON body `{results: [ {<fields>}, ... ]}`.
parse:
  shape: json_rows
  rows: results                                # the array field in the FortiOS monitor body ({results: [...]})
  fields: {ip: ip, mac: mac, hostname: hostname}   # response field -> canonical {ip, mac, hostname}
secret_domain: network                         # REUSE the existing network domain's FortiOS API token, read-only use;
                                               # audited by NAME only (C12). No new SOPS domain.
# CREDS ARE OPERATOR-EXPORTED at sweep time (there is deliberately NO secret_env_map here): gen-secret-env renders .env
# from metrics:/logs: only, never discovery:, AND the network-domain field name is INSTANCE-GENERATED by onboard
# (dogfood-observed `fortinet_fortios_1_api_token`, i.e. <ns>_<coll>_<N>_<field>) so a shipped descriptor cannot
# hardcode it. Before the sweep the operator exports KONTROLL_FORTIGATE_DISCOVERY_TOKEN from that field — see
# discovery/README.md § Extending. Unset => the source is recorded `no-creds` and skipped.
# NO applies_when -> DECLARED-only (like opnsense/logging's proxmox_api): the offer is opt-in per class. Note fortigate
# DOES ship an httpapi plugin (a `{plugin: httpapi}` predicate WOULD match it) — declared-not-derived is the deliberate
# choice so onboarding a firewall never silently starts reading its leases. The class opts in via a `discovery:` block.
access_chain:
  chain: "control VM (kontroll net) -> sweep http_get -> HTTPS GET <fortigate>/api/v2/monitor/system/dhcp (read-only)"
  may_break: nothing — a read-only lease poll; a creds/reach failure records the source `no-creds`/`unreachable`
  fallback: "no"
  blast_radius: control node only (an HTTP GET reads the lease table; actuates NOTHING on the firewall)
