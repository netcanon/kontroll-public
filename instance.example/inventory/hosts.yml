# Lab inventory TEMPLATE — FUNCTIONAL groups (role in the network), not hardware names.
# Edit hosts/IPs for YOUR fleet; each host's device_role maps to roles/<role>. The
# enabled modules in fleet.yml decide which groups are actually acted on. The IPs below
# are RFC 5737 documentation placeholders — replace with your real management addresses.

all:
  vars:
    # Defaults for the whole fleet; override per-group in group_vars/.
    ansible_user: admin

  children:

    # Edge firewall — your perimeter device (pick the matching module in fleet.yml).
    edge_firewall:
      hosts:
        my-firewall:
          ansible_host: 192.0.2.1
          device_role: fortigate          # -> roles/fortigate (or opnsense)

    # Core switch.
    core_switch:
      hosts:
        my-switch:
          ansible_host: 192.0.2.2
          device_role: cisco_ios          # -> roles/cisco_ios (or routeros)

    # Wireless AP.
    wireless_ap:
      hosts:
        my-ap:
          ansible_host: 192.0.2.3
          device_role: openwrt            # -> roles/openwrt, raw SSH

    # Hypervisors — Proxmox cluster (or your virtualization hosts).
    hypervisors:
      hosts:
        my-hypervisor:
          ansible_host: 192.0.2.10

    # Docker hosts — guests running container stacks.
    docker_hosts:
      hosts:
        my-docker-host:
          ansible_host: 192.0.2.20

    # Convenience super-groups (compose existing groups; no new hosts).
    network_devices:
      children:
        edge_firewall:
        core_switch:
        wireless_ap:

    compute:
      children:
        hypervisors:
        docker_hosts:
