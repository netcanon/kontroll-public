---
# Molecule converge — exercises a role's safe (read-only / no-op) tasks in a
# container. Device-touching tasks are skipped via the `molecule_test` flag the
# role honors, so we validate wiring + idempotence without a real device.
- name: Converge
  hosts: all
  gather_facts: false
  vars:
    molecule_test: true
    config_backup_dir: /tmp/kontroll-backups
  tasks:
    - name: Run the role's backup entrypoint (no-op under molecule_test)
      ansible.builtin.include_role:
        name: cisco_ios
        tasks_from: backup
