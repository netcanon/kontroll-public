# Molecule scenario — containerized L2/L4 test for a device-class role.
# Example targets the `cisco_ios` role's structure; for network roles that can't
# run in a plain container, Molecule still validates task syntax, var wiring, and
# (with a mocked connection) idempotence of the non-device logic.
#
# Install: pip install molecule molecule-plugins[docker]
# Run:     cd tests/molecule/default && molecule test
---
dependency:
  name: galaxy
  options:
    # generated by playbooks/bootstrap.yml from instance/fleet.yml — run the
    # bootstrap once before `molecule test` so this file exists.
    requirements-file: ../../../ansible/collections/requirements.generated.yml

driver:
  name: docker

platforms:
  - name: kontroll-roletest
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true

provisioner:
  name: ansible
  config_options:
    defaults:
      roles_path: ../../../ansible/roles
  inventory:
    host_vars:
      kontroll-roletest:
        device_role: cisco_ios

verifier:
  name: ansible        # converge + idempotence are Molecule built-ins

scenario:
  test_sequence:
    - dependency
    - syntax
    - create
    - converge
    - idempotence        # L4: second converge must report 0 changed
    - verify
    - destroy
