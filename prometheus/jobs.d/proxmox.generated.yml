# GENERATED by scripts/gen-prometheus-jobs.py from instance/fleet.yml + modules/<key>/module.yml
# + telemetry/<method>.yml. Do NOT edit by hand — change a module's metrics method or the
# telemetry descriptor and re-run (deploy-stack regenerates it before bringing Prometheus up).
scrape_configs:
  - job_name: proxmox
    metrics_path: /pve
    file_sd_configs:
      - files: ["/etc/prometheus/targets/proxmox/*.yml"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: pve-exporter:9221
