# GENERATED by scripts/gen-secret-env.py — the UNIFIED secret->env manifest, keyed by env var: per enabled
# module's referenced telemetry (metrics:) + logging (logs:) methods that declare secret_env_map, the env
# var's SOPS secret_domain + a str.format template over that domain's field NAMES. Holds ZERO secret values
# — only names. deploy-stack decrypts each referenced domain BY NAME (instance/secrets/<domain>.sops.yml)
# under no_log and composes <env>=<value> into .env via the kontroll_render_token filter (fail-soft to '').
# Do NOT edit by hand — change a method's secret_env_map and re-run gen-secret-env.
env:
