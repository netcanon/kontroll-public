    secret_domain: proxmox
    template: '{proxmox_api_token_id}'
  PVE_EXPORTER_TOKEN_VALUE:
    secret_domain: proxmox
    template: '{proxmox_api_token_secret}'
  PVE_EXPORTER_USER:
    secret_domain: proxmox
    template: '{proxmox_api_user}'
