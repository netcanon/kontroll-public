---
# Restart the journald daemon after a persistence change, and the uploader after a URL change. Both are
# idempotent (only fire on a notifying task's change) and --check-safe (skipped in check_mode).
- name: Restart systemd-journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted
  become: true

- name: Restart systemd-journal-upload
  ansible.builtin.systemd:
    name: systemd-journal-upload
    state: restarted
  become: true
