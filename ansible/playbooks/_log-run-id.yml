---
# Stamp + log this run's correlation id (Layer 0, docs/logging-architecture.md §3).
# Imported FIRST by the fleet playbooks so every run's id lands in the ansible log AND the
# Semaphore job output (Postgres-backed, queryable via the task API) — the key that correlates
# one operation across the ansible log, the Semaphore job, and (ahead) the aggregated logs.
# A caller may inject `-e kontroll_run_id=...`; otherwise a UTC timestamp is used.
#
# hosts: all + run_once (NOT hosts: localhost) so the stamp still fires under `--limit <host>`
# — the onboard verify path runs `ping.yml --limit <host>`, which a localhost-only play would
# skip, silently losing the correlation id for exactly the single-host runs. connection: local
# keeps it a no-contact, log-only task.
- name: Stamp the run correlation id
  hosts: all
  gather_facts: false
  connection: local
  tasks:
    - name: Log kontroll_run_id
      ansible.builtin.debug:
        msg: "kontroll_run_id={{ kontroll_run_id | default(now(utc=true, fmt='%Y%m%dT%H%M%SZ'), true) }}"
      run_once: true
