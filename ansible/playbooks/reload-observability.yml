---
# Reload Prometheus' config without a restart — the GUI/Semaphore enact (item F, Tier-1) for a freshly-promoted
# scrape TARGET or JOB. file-sd targets auto-reload, but a NEW job file under prometheus/jobs.d needs a config
# reload to be picked up. POSTs Prometheus' lifecycle reload endpoint (it runs with --web.enable-lifecycle) over
# the shared docker network — no docker socket, no restart, no host root. Bad config is rejected by Prometheus
# (the running config is kept), so this is safe to run after any observability promote.
#
# Access chain used:   the runner (kontroll docker network) -> http://prometheus:9090/-/reload
# May break:           nothing — a config reload only (re-reads the mounted config; rejects a bad one, keeps old)
# Fallback required:   no
# Blast radius:        the prometheus container's config (no restart, no data loss)

- name: Stamp the run correlation id
  ansible.builtin.import_playbook: _log-run-id.yml

- name: Reload Prometheus configuration (no restart)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # NOT `prometheus_url: "{{ prometheus_url | default(...) }}"`: a play var whose value names itself is a
    # recursive template. ansible-core < 2.19 happened to resolve it (the extra-var or the undefined won the lookup);
    # 2.19's templating engine detects the loop and the only human reload verb fails before its first task
    # (2026-10-08 review, finding 11). The operator override stays `-e prometheus_url=…`; the play reads it through
    # its own private name. tests/unit/test_playbook_vars_hygiene.py sweeps every playbook for the shape.
    _reload_prometheus_url: "{{ prometheus_url | default('http://prometheus:9090') }}"
  tasks:
    - name: POST the Prometheus lifecycle reload endpoint
      ansible.builtin.uri:
        url: "{{ _reload_prometheus_url }}/-/reload"
        method: POST
        status_code: [200]
      register: _reload
      changed_when: _reload.status == 200

    - name: Reload result
      ansible.builtin.debug:
        msg: "Prometheus config reloaded ({{ _reload_prometheus_url }}/-/reload -> {{ _reload.status }})."
