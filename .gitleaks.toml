# gitleaks config — secret-leak gate (tests/validate + pre-commit). Catches plaintext
# secrets in committable files BEFORE they reach a commit / the canonical / a backup /
# a bundle / a snapshot. See SECURITY.md C8.
title = "kontroll secret-scan"

[extend]
useDefault = true        # gitleaks' built-in rules (private keys, cloud creds, tokens, high-entropy)

# The age PRIVATE key is the crown-jewel secret (it decrypts every SOPS domain) — always catch it.
[[rules]]
id = "age-secret-key"
description = "age private key"
regex = '''AGE-SECRET-KEY-1[0-9A-Z]+'''
keywords = ["AGE-SECRET-KEY"]

[allowlist]
description = "intentional / non-committable paths (real secrets live encrypted or local-only)"
regexTarget = "match"
regexes = [
  # Test fixtures use a `1FAKE` sentinel in place of a real age private key (the keygen no-leak tests must
  # reference an AGE-SECRET-KEY-shaped string). A real age key is random bech32 and never starts with 1FAKE,
  # so this exempts only the obvious fakes — a genuinely-leaked key is still caught.
  '''AGE-SECRET-KEY-1FAKE[0-9A-Z]*''',
  # A quoted `KONTROLL_*` environment-variable NAME used as a tuple/list element — e.g. the test that deletes
  # `("KONTROLL_SNMP_V3_USER", "KONTROLL_SNMP_V3_AUTH_PASS", "KONTROLL_SNMP_V3_PRIV_PASS")` from the env — trips
  # gitleaks ≥8.30's generic-api-key (the `_PASS", "` run reads as key=value; the rule's match text is
  # `KONTROLL_…_AUTH_PASS", "KONTROLL_…_PRIV_PASS"`). The anchor requires the MATCH to end with a quoted name, so
  # a real assignment (`KONTROLL_X=…`, `KONTROLL_X: …`, a value after the name) is never exempted. Needed for the
  # FULL-HISTORY scan (security.yml): the current blob carries an inline `gitleaks:allow`, the 2026-06-18 blob
  # that introduced the line does not.
  '''"KONTROLL_[A-Z0-9_]+"$''',
]
paths = [
  '''^local/''',                        # gitignored: real ssh keys, discovery, IPs — never committed
  '''ansible/secrets/.*\.sops\.ya?ml$''', # SOPS CIPHERTEXT — encrypted (legacy path; kept for pre-move history)
  '''instance/secrets/.*\.sops\.ya?ml$''', # SOPS CIPHERTEXT (instance overlay) — intentionally high-entropy, encrypted
  '''\.sops\.yaml$''',                   # .sops.yaml holds age PUBLIC keys (not secret)
  '''^ansible/collections/''',           # third-party install artifacts
  # The M6 baked-code manifest: a GENERATED per-file sha256 record of scripts/kontroll/ (the "L2b for code" floor —
  # docker/README.md, SECURITY.md C16). The values are file HASHES of committed source, intentionally high-entropy;
  # a few sit on lines whose path contains "secret"/"key" (service/secrets.py, service/keygen.py), which trips
  # generic-api-key. It can only ever hold sha256 digests (regenerated by gen-code-manifest.py, --check'd in validate),
  # so a real secret can't land here without the generator being subverted — and that drift fails --check loudly.
  '''^docker/code-manifest\.lock\.yml$''',
  # The pinned IEEE OUI->vendor lookup (discovery display-hint, gen-oui.py). A GENERATED reduction of the PUBLIC IEEE
  # MA-L/MA-M/MA-S registries: keys are hex prefixes, values are vendor org names, plus one content_sha256 in the
  # lock. The lock's sha256 + the .json's high line count can trip generic entropy/api-key rules, yet the file can
  # only ever hold prefix->vendor pairs (regenerated by gen-oui.py, --check'd in validate) — a real secret can't land
  # without subverting the generator, which fails --check loudly. Same posture as code-manifest.lock.yml above.
  '''^oui/oui-lookup\.generated\.json$''',
  '''^oui/oui-lookup\.lock\.yml$''',
  '''^ansible/backups/''',               # captured device configs (gitignored)
  '''^docker/\.env\.example$''',         # placeholder values (changeme-*)
  '''^docker/\.env$''',                   # gitignored: deploy-rendered secrets (never committed)
  '''^dist/''',                          # release bundles (built; secrets stripped)
  '''kontroll-state-.*\.tar\.gz$''',     # DR snapshots (encrypted secrets only)
  # Design-review reports (the blackboard tree). Read-only agents write illustrative prose here — e.g. an
  # `-----BEGIN OPENSSH PRIVATE KEY-----` PEM *shape* when discussing key-auth onboarding — never a real secret
  # (real secrets are SOPS ciphertext under instance/secrets, allowlisted above). Source/config/secret trees
  # stay fully scanned; this only exempts the design-discussion artifacts.
  '''^docs/reviews/''',
  # The SSH-key onboard test's FAKE PEM fixture (body carries an `openssh-key-fake` / `DEADBEEF` sentinel — never a
  # real key). The working tree splits the BEGIN/END header so the working-tree scan never sees it, but the
  # FULL-HISTORY scan still hits the pre-split commit's diff. This is the one file whose sole purpose is fake-key
  # fixtures for the no-leak contract; exempt it so both scans pass. A real key here would be a glaring review miss.
  '''^tests/unit/test_onboard_ssh_key\.py$''',
]
